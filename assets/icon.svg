  <text x="256" y="424" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="800" letter-spacing="7" fill="#EAF1F8">ARFF</text>
  <text x="256" y="458" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif"
